<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111720">
  <meta name="description" content="A private workspace for deliberate engineering: projects, selected context, work packets and reviewed contributions.">
  <title>Artifacts Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23f68236'/%3E%3Cpath d='M10 28 20 9l10 19h-7l-3-6-3 6Z' fill='%23111720'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#overview" aria-label="Artifacts Studio overview"><span class="brand-mark" aria-hidden="true">a</span><span>Artifacts<span class="brand-sub">STUDIO</span></span></a>
      <div class="workspace-chip"><span class="avatar">C</span><span><strong>Cody’s workspace</strong><small>Private workspace</small></span><span class="private-lock" aria-hidden="true">⌑</span></div>
      <p class="nav-label">WORKSPACE</p>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-foot"><span class="small-orbit" aria-hidden="true"></span><div><strong>Built with intention.</strong><p>Brief. Build. Review.</p></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button menu-button" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button><span class="breadcrumb-root">Workspace</span><span class="breadcrumb-slash">/</span><span id="current-section">Overview</span></div>
        <div class="topbar-actions"><span class="privacy-label"><span class="status-dot good"></span>Private</span><button class="icon-button" data-action="refresh" aria-label="Refresh workspace" title="Refresh workspace"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.55-1.5L20 8M4 16l2.35 2.5A7 7 0 0 0 17.9 17"/></svg></button><button class="button button-primary button-small" data-action="new-task"><span aria-hidden="true">＋</span> New task</button></div>
      </header>
      <main id="main" tabindex="-1" aria-busy="true"><div class="loading-state"><span class="loader"></span><p>Opening your workspace…</p></div></main>
      <footer class="page-footer"><span>Artifacts Studio <span class="footer-dot">·</span> Your work stays deliberate.</span><span id="workspace-version">Private engineering workspace</span></footer>
    </div>
  </div>
  <dialog id="form-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Artifacts Studio needs JavaScript to load your private workspace.</p></noscript>
</body>
</html>
